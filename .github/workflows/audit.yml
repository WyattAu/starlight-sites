name: Dependency audit

on:
  schedule:
    # Every Monday 03:00 UTC (off-peak; weekly cadence avoids alert noise).
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit
        # Capture the full report; the issue step below surfaces new advisories.
        id: audit
        run: |
          set +e
          bun audit > /tmp/audit.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/audit.txt

      - name: Open or update issue on advisory
        if: steps.audit.outputs.exitcode != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/audit.txt', 'utf8');
            const title = 'Dependency vulnerability report (weekly bun audit)';
            const body = [
              'The weekly `bun audit` found advisories in the dependency tree.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              'Triaging notes:',
              '- Astro 5.x CVEs (SSRF/XSS) are accepted until the Astro 6 upgrade',
              '  (blocked by the Kobalte SSR issue; see GUI_FRONTEND_REFACTOR.md R4',
              '  and ADR-006). Do NOT file these as new.',
              '- Dev-tool advisories (markdownlint-cli -> glob/minimatch ReDoS) are',
              '  low risk; bump the tool when a fixed version is available.',
              '- File everything else as a real finding.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-audit',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-audit', 'dependencies'],
              });
              core.info(`Created issue #${created.number}`);
            }
