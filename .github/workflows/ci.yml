name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: "1.2"

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint and format check
        run: bun run lint

      - name: No-emoji lint (code, docs, config)
        run: node scripts/lint-no-emoji.js

      - name: Content validation
        run: node scripts/lint-content.js

      - name: Config validation
        run: node scripts/lint-config.js

      - name: Shared-asset integrity (sites must match canonical shared/ source)
        run: node scripts/sync-shared.mjs --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: node --test tests/unit/*.test.js

      - name: Run integration tests
        run: node --test tests/integration/*.test.js

      - name: Run Vitest component tests
        run: npx vitest run

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        site:
          - dse
          - ib
          - alevel
          - university
          - qualifications
          - languages
          - programming
          - infrastructure
          - tools

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: sites/${{ matrix.site }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: bun run build

      - name: Verify output
        working-directory: sites/${{ matrix.site }}
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - no dist directory"
            exit 1
          fi
          pages=$(find dist -name "*.html" | wc -l)
          echo "Built $pages HTML pages"
          if [ "$pages" -eq 0 ]; then
            echo "::error::Build produced 0 HTML pages"
            exit 1
          fi

      - name: Check for large assets
        working-directory: sites/${{ matrix.site }}
        run: |
          large=$(find dist -size +500k -type f 2>/dev/null | head -5)
          if [ -n "$large" ]; then
            echo "::warning::Large assets detected (>500KB):"
            echo "$large"
          fi

  summary:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint (content + config + no-emoji + sync) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test (unit + integration + Vitest) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build (9 sites) | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
