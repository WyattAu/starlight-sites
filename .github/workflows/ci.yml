name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Match the local dev environment (Bun 1.3.x). The committed bun.lock
  # uses lockfileVersion 1, which is emitted by Bun 1.3; installing with
  # Bun 1.2 in CI caused divergent resolution. Bump in lockstep with the
  # local toolchain.
  BUN_VERSION: "1.3"

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ADR-011: the site list is derived from sites/ (scripts/list-sites.js)
  # so the build matrix can never drift from reality.
  resolve-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive site list from sites/ directory
        id: sites
        run: echo "sites=$(node scripts/list-sites.js --slugs)" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint and format check
        run: bun run lint

      - name: No-emoji lint (code, docs, config)
        run: node scripts/lint-no-emoji.js

      - name: Content validation
        run: node scripts/lint-content.js

      - name: LaTeX corruption detection
        run: node scripts/lint-latex.js

      - name: Config validation
        run: node scripts/lint-config.js

      - name: Config parity validation (ADR-013)
        run: node scripts/lint-config-parity.js

      - name: Shared-asset integrity (sites must match canonical shared/ source)
        run: node scripts/sync-shared.mjs --check

      - name: Link validation
        run: node scripts/lint-links.js

      - name: Hand-wave detection
        run: node scripts/lint-handwaves.js

      - name: Description validation
        run: node scripts/lint-descriptions.js

      - name: Content depth validation
        run: node scripts/lint-depth.js

      - name: Forward reference detection
        run: node scripts/lint-forward-refs.js

      - name: Spell checking (cspell - code layer, blocking)
        run: bun run lint:spelling

      - name: Spell checking (cspell - content layer, blocking)
        run: bunx cspell "sites/*/src/content/docs/**/*.md" "sites/*/src/content/docs/**/*.mdx"

      - name: Markdown structure (markdownlint)
        run: bun run lint:markdown

      - name: External link checking (lychee)
        # Lychee is intentionally non-blocking: external links are subject
        # to third-party uptime and rate-limiting, neither of which should
        # gate a release. The .lycheeignore file excludes known flaky URLs.
        uses: lychee/lychee-action@v2
        with:
          args: "--exclude-path node_modules --exclude-file .lycheeignore --no-progress sites/*/src/content/docs/**/*.md sites/*/src/content/docs/**/*.mdx"
          fail: false

      - name: Dependency vulnerability audit (bun audit)
        # Blocking since the Astro 6 upgrade resolved the accepted Astro 5.x
        # CVEs (ADR-006, superseded). New vulnerabilities now fail CI; the
        # weekly audit.yml workflow still files triage issues for context.
        run: bun audit

      - name: TypeScript typecheck (shared/)
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: node --test tests/unit/*.test.js

      - name: Run integration tests
        run: node --test tests/integration/*.test.js

      - name: Run Vitest component tests (with coverage ratchet)
        # Thresholds live in vitest.config.ts (shared/utils >= 90/90,
        # shared/components >= 65/50) -- a breach fails this step.
        run: npx vitest run --coverage

  build:
    needs: [lint, test, resolve-sites]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.resolve-sites.outputs.sites) }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: sites/${{ matrix.site }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: bun run build

      - name: Verify output
        working-directory: sites/${{ matrix.site }}
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - no dist directory"
            exit 1
          fi
          pages=$(find dist -name "*.html" | wc -l)
          echo "Built $pages HTML pages"
          if [ "$pages" -eq 0 ]; then
            echo "::error::Build produced 0 HTML pages"
            exit 1
          fi

      - name: Check for large assets
        working-directory: sites/${{ matrix.site }}
        run: |
          large=$(find dist -size +500k -type f 2>/dev/null | head -5)
          if [ -n "$large" ]; then
            echo "::warning::Large assets detected (>500KB):"
            echo "$large"
          fi

  lighthouse:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  summary:
    needs: [lint, test, build, lighthouse]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint (content + config + no-emoji + sync + links) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test (unit + integration + Vitest) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build (all Astro sites, derived) | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse (performance) | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY
