name: Deploy All Sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # mark-good job pushes the last-good-deploy tag
  issues: write
  pull-requests: write
  actions: write    # failure path triggers rollback.yml

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the local dev environment (Bun 1.3.x) and the bun.lock format.
  BUN_VERSION: "1.3"
  LAST_GOOD_TAG: last-good-deploy

jobs:
  # ADR-011: derive the deploy matrices from sites/ so they can never drift.
  # ADR-014: deploy is staged -- a two-site canary wave is smoke-verified
  # before the remaining 43 sites roll out.
  resolve-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      canary: ${{ steps.sites.outputs.canary }}
      rollout: ${{ steps.filter.outputs.rollout }}
      all: ${{ steps.sites.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so changed-site detection can diff against the
          # last-good-deploy tag.
          fetch-depth: 0

      - name: Derive canary and rollout matrices from sites/ directory
        id: sites
        run: |
          echo "canary=$(node scripts/list-sites.js --canary-matrix)" >> "$GITHUB_OUTPUT"
          echo "rollout=$(node scripts/list-sites.js --rollout-matrix)" >> "$GITHUB_OUTPUT"
          echo "all=$(node scripts/list-sites.js --all)" >> "$GITHUB_OUTPUT"

      - name: Detect sites changed since last good deploy
        id: changed
        run: |
          # Compare against the last successfully deployed commit so a
          # sequence of pushes each only rebuilds what is still stale.
          BASE="refs/remotes/origin/last-good-deploy"
          if git rev-parse --verify --quiet "$BASE" > /dev/null 2>&1; then
            BASE=$(git rev-parse "$BASE")
          elif [ -n "${{ github.event.before }}" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi

          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No comparison base -- deploying everything."
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "slugs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE" "${{ github.sha }}" -- sites/ shared/ scripts/ search-api/ fixtures/ package.json bun.lock .github/workflows/deploy.yml > /tmp/changed-paths.txt || true
          echo "Changed paths: $(wc -l < /tmp/changed-paths.txt)"
          node scripts/list-sites.js --changed-from-file /tmp/changed-paths.txt > /tmp/changed-sites.json
          cat /tmp/changed-sites.json
          echo "force=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/changed-sites.json','utf8')).force)")" >> "$GITHUB_OUTPUT"
          echo "slugs=$(node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('/tmp/changed-sites.json','utf8')).slugs))")" >> "$GITHUB_OUTPUT"

      - name: Filter rollout matrix to changed sites
        id: filter
        env:
          FORCE: ${{ steps.changed.outputs.force }}
          SLUGS: ${{ steps.changed.outputs.slugs }}
        run: |
          # Force (shared/infra change, first deploy, unknown base) keeps the
          # full rollout; otherwise only changed sites are rebuilt. The two
          # canary sites always run their own wave regardless.
          node -e "
            const rollout = $(node scripts/list-sites.js --rollout-matrix);
            const slugs = new Set(JSON.parse(process.env.SLUGS || '[]'));
            const force = process.env.FORCE === 'true';
            const filtered = force ? rollout : rollout.filter(s => slugs.has(s.site));
            require('fs').writeFileSync(process.env.GITHUB_OUTPUT, 'rollout=' + JSON.stringify(filtered) + '\n');
            console.log('rollout sites: ' + filtered.length + ' of ' + rollout.length);
          "

  # Gate: production deployments must not proceed unless the full quality
  # suite (lint + no-emoji + sync integrity + tests) passes.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: No-emoji lint
        run: node scripts/lint-no-emoji.js

      - name: Biome lint and format check
        run: bunx biome check .

      - name: Aside directive lint
        run: node scripts/lint-asides.js

      - name: MDX parse gate
        run: node --max-old-space-size=1024 scripts/lint-mdx-parse.js

      - name: PracticeProblem corruption lint
        run: node scripts/lint-practice-components.js

      - name: Aside directive lint
        run: node scripts/lint-asides.js

      - name: MDX parse gate
        run: node --max-old-space-size=1024 scripts/lint-mdx-parse.js

      - name: llms.txt freshness
        run: node scripts/generate-llms-txt.js --check

      - name: Link graph analysis (advisory -- broken-link backlog tracked separately)
        continue-on-error: true
        run: node --max-old-space-size=1024 scripts/lint-link-graph.js

      - name: Content validation
        run: node scripts/lint-content.js

      - name: Config validation
        run: node scripts/lint-config.js

      - name: Astro config parity validation (ADR-013)
        run: node scripts/lint-config-parity.js

      - name: Shared-asset integrity
        run: node scripts/sync-shared.mjs --check

      - name: Secret pattern scan
        run: node scripts/lint-secrets.js

      - name: Link validation
        run: node scripts/lint-links.js

      - name: Hand-wave detection
        run: node scripts/lint-handwaves.js

      - name: Description validation
        run: node scripts/lint-descriptions.js

      - name: Content depth validation
        run: node scripts/lint-depth.js

      - name: Unit + integration tests
        run: node --test tests/unit/*.test.js tests/integration/*.test.js

      - name: Vitest component tests
        run: npx vitest run

  # Content-schema validation across every site, in parallel. `astro sync`
  # parses and validates all content collections (frontmatter, schemas)
  # without running the Vite build -- it catches InvalidContentEntryDataError
  # class regressions in ~2 minutes instead of after a full canary+rollout.
  content-sync:
    needs: resolve-sites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        site: ${{ fromJson(needs.resolve-sites.outputs.all) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Astro content sync (${{ matrix.site }})
        working-directory: sites/${{ matrix.site }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx astro sync

  # Wave 1 -- canary (2 sites, distinct structural variants). If this fails,
  # the rollout never starts and the blast radius is 2 sites, not 45.
  deploy-canary:
    needs: [gate, content-sync, resolve-sites]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.resolve-sites.outputs.canary) }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: sites/${{ matrix.site }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: bun run build

      - name: Verify output
        working-directory: sites/${{ matrix.site }}
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - no dist directory"
            exit 1
          fi
          pages=$(find dist -name "*.html" | wc -l)
          echo "Built $pages HTML pages"
          if [ "$pages" -eq 0 ]; then
            echo "::error::Build produced 0 HTML pages"
            exit 1
          fi

      - name: Ensure Cloudflare Pages project exists
        # Idempotent: try to create the project. If creation fails (e.g. API
        # token lacks project creation scope), log a warning and continue —
        # the deploy step will fail later if the project truly doesn't exist.
        run: |
          set +e
          bunx wrangler pages project create ${{ matrix.project }} --production-branch main 2>&1 | tee /tmp/cf-create.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            if grep -qi 'already exist' /tmp/cf-create.log; then
              echo "Project ${{ matrix.project }} already exists."
            else
              echo "::warning::Could not create Cloudflare project ${{ matrix.project }}"
              cat /tmp/cf-create.log
              echo "Continuing anyway — deploy step will verify project existence."
            fi
          else
            echo "Project ${{ matrix.project }} created."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        working-directory: sites/${{ matrix.site }}
        run: bunx wrangler pages deploy dist --project-name ${{ matrix.project }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Add custom domain (idempotent)
        continue-on-error: true
        run: |
          domain=$(echo "${{ matrix.url }}" | sed 's|https://||')
          echo "Adding custom domain $domain to project ${{ matrix.project }}..."
          resp=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/${{ matrix.project }}/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\": \"$domain\"}")
          success=$(echo "$resp" | grep -o '"success":true')
          if [ -n "$success" ]; then
            echo "Domain $domain added to project ${{ matrix.project }}."
          else
            err=$(echo "$resp" | grep -o '"message":"[^"]*"' | head -1)
            echo "Note: Domain add skipped or already configured ($err)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment (poll up to 5 minutes)
        # Cloudflare Pages propagation can take 30-90 seconds. Poll the
        # origin until it returns 200 or the budget is exhausted. If the
        # domain isn't configured yet (e.g. new sites), log a warning and
        # continue — the pages.dev URL will still be live.
        run: |
          url="${{ matrix.url }}/"
          deadline=$(( $(date +%s) + 300 ))
          status="000"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -L "$url" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "Verified: $url -> $status"
              exit 0
            fi
            echo "Probe: $url -> $status (retrying in 15s)"
            sleep 15
          done
          echo "::warning::Site $url did not return 200 within 5 minutes (last status: $status)"
          echo "This is expected for new sites — custom domain may need Cloudflare Dashboard config."

      - name: Verify deployment freshness (content nonce)
        # A 200 on the site URL can be served by a stale production build.
        # A content-hashed asset from THIS build's dist can only exist on
        # the new deployment -- 404 means the deploy did not promote.
        run: |
          asset=$(grep -oE '/_astro/[A-Za-z0-9._-]+\.(css|js)' sites/${{ matrix.site }}/dist/index.html | head -1)
          if [ -z "$asset" ]; then
            echo "::warning::No hashed asset found in dist/index.html -- skipping freshness check"
            exit 0
          fi
          deadline=$(( $(date +%s) + 240 ))
          code="000"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ matrix.url }}$asset" 2>/dev/null || echo "000")
            [ "$code" = "200" ] && break
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::Freshness check failed: $asset -> $code (stale deployment?)"
            exit 1
          fi
          echo "Freshness verified: $asset -> 200"

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.site }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ matrix.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # Wave 2 -- full rollout. Runs only after every canary site deployed and
  # verified 200 OK. fail-fast:false so one bad site does not cancel the
  # other 42 in-flight builds (each is independent).
  deploy-rollout:
    needs: [gate, resolve-sites, deploy-canary]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-sites.outputs.rollout) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: sites/${{ matrix.site }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: bun run build

      - name: Verify output
        working-directory: sites/${{ matrix.site }}
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - no dist directory"
            exit 1
          fi
          pages=$(find dist -name "*.html" | wc -l)
          echo "Built $pages HTML pages"
          if [ "$pages" -eq 0 ]; then
            echo "::error::Build produced 0 HTML pages"
            exit 1
          fi

      - name: Ensure Cloudflare Pages project exists
        # Idempotent: try to create the project. If creation fails (e.g. API
        # token lacks project creation scope), log a warning and continue —
        # the deploy step will fail later if the project truly doesn't exist.
        run: |
          set +e
          bunx wrangler pages project create ${{ matrix.project }} --production-branch main 2>&1 | tee /tmp/cf-create.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            if grep -qi 'already exist' /tmp/cf-create.log; then
              echo "Project ${{ matrix.project }} already exists."
            else
              echo "::warning::Could not create Cloudflare project ${{ matrix.project }}"
              cat /tmp/cf-create.log
              echo "Continuing anyway — deploy step will verify project existence."
            fi
          else
            echo "Project ${{ matrix.project }} created."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        working-directory: sites/${{ matrix.site }}
        run: bunx wrangler pages deploy dist --project-name ${{ matrix.project }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Add custom domain (idempotent)
        continue-on-error: true
        run: |
          domain=$(echo "${{ matrix.url }}" | sed 's|https://||')
          echo "Adding custom domain $domain to project ${{ matrix.project }}..."
          resp=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/${{ matrix.project }}/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\": \"$domain\"}")
          success=$(echo "$resp" | grep -o '"success":true')
          if [ -n "$success" ]; then
            echo "Domain $domain added to project ${{ matrix.project }}."
          else
            err=$(echo "$resp" | grep -o '"message":"[^"]*"' | head -1)
            echo "Note: Domain add skipped or already configured ($err)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment (poll up to 5 minutes)
        # Cloudflare Pages propagation can take 30-90 seconds. Poll the
        # origin until it returns 200 or the budget is exhausted. If the
        # domain isn't configured yet (e.g. new sites), log a warning and
        # continue — the pages.dev URL will still be live.
        run: |
          url="${{ matrix.url }}/"
          deadline=$(( $(date +%s) + 300 ))
          status="000"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -L "$url" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "Verified: $url -> $status"
              exit 0
            fi
            echo "Probe: $url -> $status (retrying in 15s)"
            sleep 15
          done
          echo "::warning::Site $url did not return 200 within 5 minutes (last status: $status)"
          echo "This is expected for new sites — custom domain may need Cloudflare Dashboard config."

      - name: Verify deployment freshness (content nonce)
        # A 200 on the site URL can be served by a stale production build.
        # A content-hashed asset from THIS build's dist can only exist on
        # the new deployment -- 404 means the deploy did not promote.
        run: |
          asset=$(grep -oE '/_astro/[A-Za-z0-9._-]+\.(css|js)' sites/${{ matrix.site }}/dist/index.html | head -1)
          if [ -z "$asset" ]; then
            echo "::warning::No hashed asset found in dist/index.html -- skipping freshness check"
            exit 0
          fi
          deadline=$(( $(date +%s) + 240 ))
          code="000"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ matrix.url }}$asset" 2>/dev/null || echo "000")
            [ "$code" = "200" ] && break
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::Freshness check failed: $asset -> $code (stale deployment?)"
            exit 1
          fi
          echo "Freshness verified: $asset -> 200"

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.site }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ matrix.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
  deploy-landing:
    # Landing follows the canary wave: it deploys only after the canary
    # proved the build pipeline; it does not wait for all 43 rollout sites.
    needs: [gate, deploy-canary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build landing page
        working-directory: sites/main
        run: bun run build

      - name: Add cross-site search script
        run: cp search-api/cross-site-search.js sites/main/dist/cross-site-search.js

      - name: Deploy landing page
        run: bunx wrangler pages deploy sites/main/dist --project-name wyattsnotes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        if: always()
        run: |
          echo "## Landing Page" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://wyattsnotes.wyattau.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: wyattsnotes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  update-search-index:
    needs: deploy-rollout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: success()
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Always build the merged search index so merged-index.json is fresh
      # even when KV is not configured. The generated merged-index.js is
      # bundled into the Worker as a static fallback.
      - name: Build merged search index
        working-directory: search-api
        run: node build-search-index.js

      # Guard: the KV upload + Worker deployment require the KV namespace
      # secret. When it is absent the sites have already deployed; deploy
      # the Worker without KV (uses static fallback) instead.
      - name: Check KV secret present
        id: kvcheck
        env:
          KV_NS: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          if [ -z "$KV_NS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_KV_NAMESPACE_ID secret is not set; deploying Worker with static index fallback (no KV). Set the secret to enable KV-backed search index refresh."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload index to KV
        if: steps.kvcheck.outputs.skip != 'true'
        working-directory: search-api
        run: node upload-index.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}

      - name: Deploy search Worker (with KV)
        if: steps.kvcheck.outputs.skip != 'true'
        working-directory: search-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          sed "s|^id = \"\"$|id = \"${KV_NAMESPACE_ID}\"|" wrangler.toml > wrangler.deploy.toml
          bunx wrangler deploy --config wrangler.deploy.toml --name wyattsnotes-search --compatibility-date 2024-01-01
          rm -f wrangler.deploy.toml

      - name: Deploy search Worker (no KV, static fallback)
        if: steps.kvcheck.outputs.skip == 'true'
        working-directory: search-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip the KV namespace binding and deploy — worker uses the
          # bundled merged-index.js as a static fallback.
          awk '/^\[\[kv_namespaces\]\]/{skip=1; next} skip && /^\[/{skip=0} !skip' wrangler.toml > wrangler.deploy.toml
          bunx wrangler deploy --config wrangler.deploy.toml --name wyattsnotes-search --compatibility-date 2024-01-01
          rm -f wrangler.deploy.toml

      - name: Upload merged-index.json as build artifact
        if: steps.kvcheck.outputs.skip == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: merged-search-index
          path: search-api/merged-index.json
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## Search Index" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: wyattsnotes-search" >> $GITHUB_STEP_SUMMARY
          echo "- **KV Namespace**: WYATTSNOTES-SEARCH" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  mark-good:
    # ADR-014: on a fully successful deploy, move the last-good-deploy tag.
    # rollback.yml (manual or auto-triggered) redeploys this commit.
    needs: [deploy-canary, deploy-rollout, deploy-landing, update-search-index]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Move last-good-deploy tag to this commit
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${LAST_GOOD_TAG}"; then
            git tag -f "${LAST_GOOD_TAG}" "$GITHUB_SHA"
            git push -f origin "${LAST_GOOD_TAG}"
            echo "Moved ${LAST_GOOD_TAG} -> $GITHUB_SHA"
          else
            git tag "${LAST_GOOD_TAG}" "$GITHUB_SHA"
            git push origin "${LAST_GOOD_TAG}"
            echo "Created ${LAST_GOOD_TAG} at $GITHUB_SHA"
          fi

  rollback-on-failure:
    # ADR-014: if a deploy wave failed after sites started changing, trigger
    # the rollback workflow automatically (redeploy of last-good-deploy).
    # Skipped when only the gate failed -- no site changed, nothing to undo.
    # A SKIPPED deploy-rollout is also legitimate: the path filter found no
    # changed sites in this push, so there is nothing to roll back either.
    needs: [deploy-canary, deploy-rollout, update-search-index]
    if: >-
      failure() &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-rollout.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger rollback of last-good-deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${LAST_GOOD_TAG}"; then
            echo "::warning::Deploy failed after sites changed -- triggering rollback to ${LAST_GOOD_TAG}"
            gh workflow run rollback.yml --ref main
          else
            echo "::warning::Deploy failed but no ${LAST_GOOD_TAG} tag exists yet (first deploy?) -- skipping rollback."
          fi

  summary:
    needs: [deploy-canary, deploy-rollout, deploy-landing, update-search-index, mark-good, rollback-on-failure]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy Summary
        run: |
          echo "## Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Canary wave (2 sites) | ${{ needs.deploy-canary.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollout wave (43 sites) | ${{ needs.deploy-rollout.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Landing | ${{ needs.deploy-landing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Search Index | ${{ needs.update-search-index.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Key URLs" >> $GITHUB_STEP_SUMMARY
          echo "| Site | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Landing | https://wyattsnotes.wyattau.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Search API | https://wyattsnotes-search.workers.dev/api/search |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | https://search.wyattau.com/dashboard |" >> $GITHUB_STEP_SUMMARY
          echo "| DSE | https://dse.wyattau.com |" >> $GITHUB_STEP_SUMMARY
          echo "| IB | https://ib.wyattau.com |" >> $GITHUB_STEP_SUMMARY
          echo "| A-Level | https://alevel.wyattau.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Programming | https://programming.wyattau.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Languages | https://languages.wyattau.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Tools | https://tools.wyattau.com |" >> $GITHUB_STEP_SUMMARY
