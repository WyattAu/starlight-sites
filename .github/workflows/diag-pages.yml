name: Pages Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-pages.yml'
      - 'TEMP-TRIGGER'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        # Pure Python: the previous bash loop embedded multi-line
        # `python3 -c "..."` snippets at column 1, which terminated the
        # YAML block scalar and made this workflow file unparseable.
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")

          def get(path):
              # Print-and-continue on HTTP errors: this is a diagnostic,
              # and Pages secrets may be scoped to the default branch.
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/{path}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  return {"success": False,
                          "errors": f"HTTP {e.code}: {e.read(400).decode(errors='replace')}"}
              except Exception as e:  # diagnostic must not crash the step
                  return {"success": False, "errors": f"{type(e).__name__}: {e}"}

          for project in ["wyattsnotes-accounting", "wyattsnotes-economics", "wyattsnotes-finance"]:
              print(f"===== {project} =====")
              print("--- project ---")
              d = get(f"projects/{project}")
              if not d.get("success"):
                  print("ERROR:", json.dumps(d.get("errors"))[:400])
              else:
                  r = d["result"]
                  print("production_branch:", r.get("production_branch"))
                  print("domains:", r.get("domains"))
                  print("latest_deployment:", json.dumps(r.get("latest_deployment") or {}, default=str)[:600])
              print("--- deployments (latest 3) ---")
              d = get(f"projects/{project}/deployments")
              if not d.get("success"):
                  print("ERROR:", json.dumps(d.get("errors"))[:400])
              else:
                  for dep in d["result"][:3]:
                      keys = ["id", "environment", "deployment_trigger", "latest_stage", "created_on", "url"]
                      print(json.dumps({k: dep.get(k) for k in keys}, default=str)[:500])
              print("--- domains ---")
              d = get(f"projects/{project}/domains")
              if not d.get("success"):
                  print("ERROR:", json.dumps(d.get("errors"))[:400])
              else:
                  for dom in d["result"]:
                      keys = ["name", "status", "validation_data", "created_on"]
                      print(json.dumps({k: dom.get(k) for k in keys}, default=str)[:500])
