name: E2E Tests

on:
  schedule:
    # Daily 03:30 UTC, after the typical deploy window.
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Derive e2e target URLs (validated against sites/)
        run: node scripts/list-sites.js --urls > /tmp/e2e-urls.json && cat /tmp/e2e-urls.json

      - name: Run Playwright against the preview-subset production sites
        # The playwright.config.ts project list mirrors the preview subset
        # policy (ADR-011) and is membership-validated by
        # tests/unit/no-ghost-sites.test.js, so it cannot drift into
        # referencing defunct sites again.
        run: bunx playwright test --config=tests/e2e/playwright.config.ts

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `E2E Failure: Live-site smoke tests (${new Date().toISOString().split('T')[0]})`;
            const body = `## E2E Tests Failed\n\nOne or more Playwright specs failed against the production sites.\n\nSee workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'alert,e2e'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['alert', 'e2e']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body
              });
            }

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
