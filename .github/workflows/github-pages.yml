# GitHub Pages Mirror Deployment
# Deploys all sites to GitHub Pages for DA backlink acquisition
# Canonical tags point to wyattau.com to avoid duplicate content penalty
#
# NOTE: This workflow is disabled for now due to deployment issues.
# The primary deployment is via Cloudflare Pages (deploy.yml).
# To enable, change the if condition below to 'true'.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'shared/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    if: false  # Set to true to enable GitHub Pages deployment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-pages-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-pages-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync shared components
        run: bun run sync

      - name: Build all sites
        run: |
          FAILED=0
          for site in sites/*/; do
            site_name=$(basename "$site")
            if [ -f "$site/astro.config.mjs" ]; then
              echo "Building $site_name..."
              cd "$site"
              if ! timeout 120 bun run build 2>&1; then
                echo "Warning: Build failed for $site_name (timeout or error)"
                FAILED=1
              fi
              cd ../..
            fi
          done
          echo "Build complete (some sites may have failed)"
          exit 0

      - name: Collect all dist folders
        run: |
          mkdir -p _pages
          for site in sites/*/; do
            site_name=$(basename "$site")
            if [ -d "$site/dist" ]; then
              echo "Collecting $site_name..."
              cp -r "$site/dist" "_pages/$site_name"
            fi
          done

      - name: Add GitHub Pages metadata
        run: |
          # Add 404 page
          cat > _pages/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>404 - Page Not Found</title></head>
          <body>
            <h1>Page Not Found</h1>
            <p>This page has moved to <a href="https://wyattsnotes.wyattau.com">wyattsnotes.wyattau.com</a></p>
            <script>window.location.href = "https://wyattsnotes.wyattau.com";</script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
