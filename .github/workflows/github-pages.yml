# GitHub Pages Mirror Deployment
# Deploys all sites to GitHub Pages for DA backlink acquisition
# Canonical tags point to wyattau.com to avoid duplicate content penalty

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync shared components
        run: bun run sync

      - name: Build all sites
        run: |
          for site in sites/*/; do
            site_name=$(basename "$site")
            if [ -f "$site/astro.config.mjs" ]; then
              echo "Building $site_name..."
              cd "$site"
              bun run build 2>&1 || echo "Warning: Build failed for $site_name"
              cd ../..
            fi
          done

      - name: Collect all dist folders
        run: |
          mkdir -p _pages
          for site in sites/*/; do
            site_name=$(basename "$site")
            if [ -d "$site/dist" ]; then
              echo "Collecting $site_name..."
              cp -r "$site/dist" "_pages/$site_name"
            fi
          done

      - name: Add GitHub Pages metadata
        run: |
          # Add _headers file for GitHub Pages
          cat > _pages/_headers << 'EOF'
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
          EOF

          # Add 404 page
          cat > _pages/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>404 - Page Not Found</title></head>
          <body>
            <h1>Page Not Found</h1>
            <p>This page has moved to <a href="https://wyattsnotes.wyattau.com">wyattsnotes.wyattau.com</a></p>
            <script>window.location.href = "https://wyattsnotes.wyattau.com";</script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          sleep 30
          curl -s -o /dev/null -w "%{http_code}" https://username.github.io/starlight-sites/ || echo "Deployment verification pending"
