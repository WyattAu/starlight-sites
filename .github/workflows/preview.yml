name: Preview Deployments

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.2"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: dse
            project: wyattsnotes-dse
          - site: ib
            project: wyattsnotes-ib
          - site: alevel
            project: wyattsnotes-alevel
          - site: university
            project: wyattsnotes-university
          - site: qualifications
            project: wyattsnotes-qualifications
          - site: programming
            project: wyattsnotes-programming
          - site: infrastructure
            project: wyattsnotes-infrastructure
          - site: languages
            project: wyattsnotes-languages
          - site: tools
            project: wyattsnotes-tools

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: sites/${{ matrix.site }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: bun run build

      - name: Verify output
        working-directory: sites/${{ matrix.site }}
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - no dist directory"
            exit 1
          fi
          pages=$(find dist -name "*.html" | wc -l)
          echo "Built $pages HTML pages"

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        working-directory: sites/${{ matrix.site }}
        run: |
          DEPLOYMENT_URL=$(npx wrangler@4 pages deploy dist --project-name ${{ matrix.project }} --branch "pr-${{ github.event.pull_request.number }}" 2>&1 | grep -oP 'https://[^\s]+' | head -1)
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview URL
        if: matrix.site == 'dse'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            if (!url) {
              core.warning('No deployment URL found');
              return;
            }

            const body = `## Preview Deployments

            | Site | Preview URL |
            |------|-------------|
            | **${{ matrix.site }}** | ${url} |

            _Updated: ${new Date().toISOString()}_`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Preview Deployments') && c.user.type === 'Bot'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.site }} Preview" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: pr-${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
