name: Preview Deployments

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the local dev environment (Bun 1.3.x) and the bun.lock format.
  BUN_VERSION: "1.3"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: dse
            project: wyattsnotes-dse
          - site: ib
            project: wyattsnotes-ib
          - site: alevel
            project: wyattsnotes-alevel
          - site: university
            project: wyattsnotes-university
          - site: qualifications
            project: wyattsnotes-qualifications
          - site: programming
            project: wyattsnotes-programming
          - site: infrastructure
            project: wyattsnotes-infrastructure
          - site: languages
            project: wyattsnotes-languages
          - site: tools
            project: wyattsnotes-tools

    outputs:
      dse: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: sites/${{ matrix.site }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: bun run build

      - name: Verify output
        working-directory: sites/${{ matrix.site }}
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - no dist directory"
            exit 1
          fi
          pages=$(find dist -name "*.html" | wc -l)
          echo "Built $pages HTML pages"

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        working-directory: sites/${{ matrix.site }}
        run: |
          DEPLOYMENT_URL=$(npx wrangler@4 pages deploy dist --project-name ${{ matrix.project }} --branch "pr-${{ github.event.pull_request.number }}" 2>&1 | grep -oP 'https://[^\s]+' | head -1)
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "## ${{ matrix.site }} Preview" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: pr-${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Append URL to PR comment file
        # Collect every site's URL into a shared artifact so the comment
        # job can render all 9 preview URLs in one PR comment, instead of
        # posting 9 separate comments or only the DSE URL (historical bug).
        run: |
          printf '| %s | %s |\n' '${{ matrix.site }}' '${{ steps.deploy.outputs.url }}' >> preview-urls.txt
          cat preview-urls.txt

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-url-${{ matrix.site }}
          path: preview-urls.txt
          retention-days: 1
          if-no-files-found: error

  comment:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download all preview URL artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: preview-url-*
          merge-multiple: true
          path: urls

      - name: Aggregate URLs into single table
        id: aggregate
        run: |
          {
            echo 'table<<EOF'
            echo '| Site | Preview URL |'
            echo '|------|-------------|'
            cat urls/preview-urls.txt 2>/dev/null | sort
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post/update aggregated PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const body = [
              '## Preview Deployments',
              '',
              `${{ steps.aggregate.outputs.table }}`,
              '',
              `_Updated: ${new Date().toISOString()}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('## Preview Deployments') && c.user.type === 'Bot'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
