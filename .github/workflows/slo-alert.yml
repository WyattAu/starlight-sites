name: Search SLO Alert

on:
  schedule:
    # Every 30 minutes. /api/health exposes the search-quality metrics
    # (zero-result rate, latency) that this workflow enforces.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: slo-alert
  cancel-in-progress: false

env:
  # SLO targets (mirrored from worker /api/health slo block and
  # CODE_QUALITY_MATRIX.md G5). Alert thresholds are deliberately looser
  # than the targets to avoid paging on brief boundary jitter.
  HEALTH_URL: https://search.wyattau.com/api/health
  MAX_ZERO_RESULT_RATE: "10" # percent
  MAX_AVG_LATENCY_MS: "500"
  # A violation persists across many probes; one issue comment per day is
  # the signal, sixty per day is noise (starlight-sites#22 reached 300).
  COMMENT_THROTTLE_HOURS: "20"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /api/health and evaluate SLOs
        id: slo
        run: |
          set -u
          curl -s --max-time 20 "$HEALTH_URL" -o /tmp/health.json
          EVAL=$(node -e '
            const fs = require("fs")
            const h = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"))
            const rate = parseFloat(h.search.zeroResultRate)
            const latency = h.search.avgLatencyMs
            const violations = []
            if (!Number.isNaN(rate) && rate > Number(process.env.MAX_ZERO_RESULT_RATE))
              violations.push(`zero-result rate ${rate}% > ${process.env.MAX_ZERO_RESULT_RATE}%`)
            if (latency !== null && latency > Number(process.env.MAX_AVG_LATENCY_MS))
              violations.push(`avg latency ${latency}ms > ${process.env.MAX_AVG_LATENCY_MS}ms`)
            console.log(JSON.stringify({ violations, rate, latency, searches: h.search.totalSearches }))
          ')
          echo "eval=$EVAL" >> "$GITHUB_OUTPUT"
          echo "$EVAL"
          if [ "$(node -e "console.log(JSON.parse(process.argv[1]).violations.length)" "$EVAL")" -gt 0 ]; then
            echo "violations=true" >> "$GITHUB_OUTPUT"
          else
            echo "violations=false" >> "$GITHUB_OUTPUT"
          fi

      # Values arrive through env, never through direct ${{ }} interpolation
      # inside a script: the probe output is data, not source (zizmor).
      - name: Report SLO violation
        if: steps.slo.outputs.violations == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EVAL_JSON: ${{ steps.slo.outputs.eval }}
          ZERO_RESULT_LIMIT: ${{ env.MAX_ZERO_RESULT_RATE }}
          LATENCY_LIMIT: ${{ env.MAX_AVG_LATENCY_MS }}
          THROTTLE_HOURS: ${{ env.COMMENT_THROTTLE_HOURS }}
        with:
          script: |
            const evalData = JSON.parse(process.env.EVAL_JSON);
            const body = [
              '## Search SLO Violation',
              '',
              ...evalData.violations.map(v => `- ${v}`),
              '',
              `Metrics at probe time: zero-result rate **${evalData.rate}%**, avg latency **${evalData.latency} ms**, total searches **${evalData.searches}**.`,
              '',
              `Targets (CODE_QUALITY_MATRIX.md): zero-result rate < 5%, avg latency < 200 ms.`,
              `Alert thresholds: < ${process.env.ZERO_RESULT_LIMIT}% / < ${process.env.LATENCY_LIMIT} ms.`,
              '',
              `Dashboard: https://search.wyattau.com/dashboard`,
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            // Newest open alert first. The previous version took issues[0],
            // which GitHub returns oldest-first, so every violation piled
            // onto the same year-old issue instead of the current one.
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'alert,slo',
              sort: 'created',
              direction: 'desc',
              per_page: 10
            })).data.filter(i => !i.pull_request);

            if (open.length === 0) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `SLO Alert: Search quality degraded (${new Date().toISOString().split('T')[0]})`,
                body,
                labels: ['alert', 'slo']
              });
              core.info(`opened issue #${created.data.number}`);
              return;
            }

            const issue = open[0];
            const ageHours = (Date.now() - new Date(issue.updated_at).getTime()) / 3_600_000;
            if (ageHours < Number(process.env.THROTTLE_HOURS)) {
              core.info(`issue #${issue.number} updated ${ageHours.toFixed(1)}h ago; throttled`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
            core.info(`commented on issue #${issue.number}`);

      # An alert that never closes is indistinguishable from an unfixed
      # incident. Recovery closes the issue with the evidence attached.
      - name: Close recovered SLO alerts
        if: steps.slo.outputs.violations == 'false'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EVAL_JSON: ${{ steps.slo.outputs.eval }}
        with:
          script: |
            const evalData = JSON.parse(process.env.EVAL_JSON);
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'alert,slo',
              per_page: 100
            })).data.filter(i => !i.pull_request);

            if (open.length === 0) {
              core.info('no open SLO alerts');
              return;
            }

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: zero-result rate **${evalData.rate}%**, avg latency **${evalData.latency} ms** are back within the alert thresholds. Closing.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              core.info(`closed issue #${issue.number}`);
            }
