name: Upload Search Index

on:
  workflow_dispatch:
  # Daily at 00:10 UTC -- right after the Cloudflare KV free-tier daily
  # write quota resets. Other apps on the account drain the quota during
  # the day, so the full-index upload must win the race at reset.
  schedule:
    - cron: '10 0 * * *'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: bun install --frozen-lockfile
      # Rebuild from the live network -- the committed merged-index.json is
      # whatever the last deploy produced, not current content.
      - name: Build merged search index
        working-directory: search-api
        run: node build-search-index.js
      - name: Upload search index to KV
        working-directory: search-api
        run: node upload-index.js
        env:
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
