name = "wyattsnotes-account"
main = "worker.js"
compatibility_date = "2024-01-01"

# D1 database binding for user data
[[d1_databases]]
binding = "DB"
database_name = "wyattsnotes-account"
database_id = "b7ce0806-df4b-4ab1-a473-c4cb8f4bef93"

# KV namespace for session tokens
[[kv_namespaces]]
binding = "SESSIONS"
id = "72b264a42f1b49aea7c66c3abd77a822"

# Environment variables
[vars]
ENVIRONMENT = "production"
TOKEN_EXPIRY_HOURS = "720"
CORS_ORIGIN = "https://wyattsnotes.wyattau.com"
