<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Analytics — Wyatt's Notes</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #ff6b35; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; }
    .card h2 { font-size: 1rem; margin-bottom: 1rem; color: #94a3b8; }
    .stat { font-size: 2.5rem; font-weight: 800; color: #ff6b35; }
    .label { font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
    .badge { display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
    .refresh { background: #ff6b35; color: white; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .refresh:hover { background: #ff8c4a; }
    .time { font-size: 0.8rem; color: #64748b; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Search Analytics</h1>
  
  <div class="grid">
    <div class="card">
      <h2>Health</h2>
      <div class="stat" id="status">—</div>
      <div class="label">API Status</div>
    </div>
    <div class="card">
      <h2>Total Entries</h2>
      <div class="stat" id="entries">—</div>
      <div class="label">Indexed pages across all sites</div>
    </div>
    <div class="card">
      <h2>Sites</h2>
      <div class="stat" id="sites">—</div>
      <div class="label">Connected sites</div>
    </div>
    <div class="card">
      <h2>Last Updated</h2>
      <div class="stat" id="updated" style="font-size:1.5rem">—</div>
      <div class="label">Index freshness</div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 1.5rem">
    <h2>Trending Searches</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Query</th>
          <th>Searches</th>
          <th>Last Searched</th>
        </tr>
      </thead>
      <tbody id="trending-body">
        <tr><td colspan="4" style="text-align:center;color:#64748b">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>Connected Sites</h2>
    <table>
      <thead>
        <tr>
          <th>Site</th>
          <th>URL</th>
          <th>Authority</th>
        </tr>
      </thead>
      <tbody id="sites-body">
        <tr><td colspan="3" style="text-align:center;color:#64748b">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div style="text-align:center;margin-top:1.5rem">
    <button class="refresh" onclick="loadAll()">Refresh</button>
    <div class="time" id="timestamp"></div>
  </div>

  <script>
    const API = 'https://search.wyattau.com/api';

    async function loadAll() {
      await Promise.all([loadHealth(), loadTrending(), loadSites()]);
      document.getElementById('timestamp').textContent = 'Updated: ' + new Date().toLocaleTimeString();
    }

    async function loadHealth() {
      try {
        const resp = await fetch(`${API}/health`);
        const data = await resp.json();
        document.getElementById('status').textContent = data.status === 'ok' ? 'OK' : 'FAIL';
        document.getElementById('entries').textContent = data.totalEntries.toLocaleString();
        document.getElementById('sites').textContent = data.siteCount;
        const updated = new Date(data.lastUpdated);
        document.getElementById('updated').textContent = updated.toLocaleDateString() + ' ' + updated.toLocaleTimeString();
      } catch {
        document.getElementById('status').textContent = 'FAIL';
      }
    }

    async function loadTrending() {
      try {
        const resp = await fetch(`${API}/trending`);
        const data = await resp.json();
        const tbody = document.getElementById('trending-body');
        
        if (!data.trending || data.trending.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#64748b">No searches yet</td></tr>';
          return;
        }

        tbody.innerHTML = data.trending.sort((a,b) => b.count - a.count).map((t, i) => `
          <tr>
            <td>${i + 1}</td>
            <td><strong>${escapeHtml(t.query)}</strong></td>
            <td>${t.count}</td>
            <td>${new Date(t.lastSearched).toLocaleString()}</td>
          </tr>
        `).join('');
      } catch {
        document.getElementById('trending-body').innerHTML = '<tr><td colspan="4" style="text-align:center;color:#64748b">Failed to load</td></tr>';
      }
    }

    async function loadSites() {
      try {
        const resp = await fetch(`${API}/sites`);
        const data = await resp.json();
        const tbody = document.getElementById('sites-body');
        
        tbody.innerHTML = data.sites.map(s => `
          <tr>
            <td><span class="badge" style="background:${s.color}20;color:${s.color}">${escapeHtml(s.name)}</span></td>
            <td><a href="${s.url}" style="color:#ff6b35;text-decoration:none">${s.url}</a></td>
            <td>${s.authority}</td>
          </tr>
        `).join('');
      } catch {
        document.getElementById('sites-body').innerHTML = '<tr><td colspan="3" style="text-align:center;color:#64748b">Failed to load</td></tr>';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadAll();
    setInterval(loadAll, 60000);
  </script>
</body>
</html>
